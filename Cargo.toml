[package]
name = "withings-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line client for the Withings API: body measurements, activity, sleep, workouts and raw calls"
license = "MIT"

[[bin]]
name = "withings"
path = "src/main.rs"

[profile.release]
strip = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
